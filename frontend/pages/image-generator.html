<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image Generator</title>

    <link rel="stylesheet" href="../assets/css/topbar.css">
    <link rel="stylesheet" href="../assets/css/sidebar.css">
    <link rel="stylesheet" href="../assets/css/image-generator.css">

</head>

<body>

    <!-- Topbar -->

    <div class="topbar">

        <button class="menu-btn" onclick="toggleSidebar()">
            ☰
        </button>

        <div class="logo">
            AI Hub
        </div>

    </div>


    <!-- Sidebar -->

    <div class="sidebar" id="sidebar">

        <h2>AI Tools</h2>

        <ul>

            <li onclick="location.href='home.html'">
                💬 AI Chat
            </li>

            <li onclick="location.href='code-generator.html'">
                💻 Code Generator
            </li>

            <li onclick="location.href='bug-fixer.html'">
                🐞 Bug Fixer
            </li>

            <li onclick="location.href='image-generator.html'">
                🎨 Image AI
            </li>

            <li onclick="location.href='learning.html'">
                📚 Learning
            </li>

            <li onclick="location.href='settings.html'">
                ⚙ Settings
            </li>

        </ul>

    </div>


    <!-- Main Content -->

    <main class="image-generator">

        <h1>🎨 AI Image Generator</h1>

        <p>
            Describe the image you want to create.
        </p>


        <div class="image-input">

            <textarea
                id="imagePrompt"
                placeholder="Example: A futuristic city with flying cars at sunset..."
            ></textarea>

            <button id="generateImageBtn">
                Generate Image 🎨
            </button>

        </div>


        <!-- Loading -->

        <div id="imageLoading" class="image-loading">

            Generating image... ⏳

        </div>


        <!-- Result -->

        <div id="imageResult" class="image-result">

            <p>
                Your generated image will appear here.
            </p>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/image-generator.js"></script>

</body>

</html>
